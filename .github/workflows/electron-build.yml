name: Build Electron Installers

on:
  push:
    tags:
      - 'v*'

# One build per tag. Never cancel an in-flight build: a cancelled run can leave a
# release holding latest*.yml with no matching binary, which makes electron-updater
# 404 mid-download for every user on that channel.
concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # electron-builder's GitHub publisher uploads into an existing release for the
      # tag. It must exist and must NOT be a draft: latest*.yml inside a draft release
      # is not publicly fetchable, so the updater would silently see no update.
      - name: Create release for tag (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - reusing it."
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "Release $TAG is a draft - publishing it so latest*.yml is fetchable."
              gh release edit "$TAG" --draft=false
            fi
          else
            # Tags like v1.2.3-beta.1 are prereleases so they never become the
            # "latest" release for users on the stable channel.
            PRERELEASE=""
            case "$TAG" in
              *-*) PRERELEASE="--prerelease" ;;
            esac
            echo "Creating release $TAG ${PRERELEASE:-(stable)}"
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              $PRERELEASE
          fi

  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build Electron
        run: npm run build:electron

      # --publish always is what makes electron-builder generate AND upload
      # latest.yml + .blockmap alongside the installer. Without it the updater
      # has no metadata to read and is completely inert.
      - name: Package and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS Installer
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build Electron
        run: npm run build:electron

      # macOS stays unsigned for now (see issue #10), so CSC auto-discovery stays off.
      - name: Package and publish macOS installer
        run: npx electron-builder --mac --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux Installer
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build Electron
        run: npm run build:electron

      - name: Package and publish Linux installers
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-old-releases:
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      # Keep a deep catalog and never delete tags: the in-app updater offers
      # "downgrade to a specific version", and a deleted release or tag is a
      # version nobody can roll back to.
      - name: Delete old releases (keep latest 30, keep all tags)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 30
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
