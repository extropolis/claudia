name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Cancel previous publish when a new version is released
concurrency:
  group: npm-publish
  cancel-in-progress: true

jobs:
  # Job 1: Build and test (runs automatically)
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Run tests
        run: npm test -w backend

      - name: Verify tag matches version.txt
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          FILE_VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "🏷️  Git tag:     v$TAG_VERSION"
          echo "📄 version.txt: $FILE_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo ""
            echo "❌ version.txt ($FILE_VERSION) does not match tag (v$TAG_VERSION)"
            echo "Update version.txt to $TAG_VERSION and run: node scripts/bump-version.mjs"
            exit 1
          fi
          echo "✅ version.txt matches tag"

      - name: Verify all package.json versions match version.txt
        run: node scripts/bump-version.mjs --check

  # Job 2: Publish (requires manual approval via GitHub Environment)
  publish:
    name: Publish to npm
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w shared

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Publish @extropolis/claudia
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Published successfully
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "🎉 Successfully published @extropolis/claudia@$TAG_VERSION to npm"
