# Coder server + PostgreSQL
# Run with: docker compose -f coder/docker-compose.yaml up -d
#
# Prerequisites:
#   1. Build the Claudia image first:  docker build -t claudia .
#   2. Set CODER_ACCESS_URL to your public domain
#
# Then open http://your-domain:7080 to create your admin account.

services:
  coder:
    image: ghcr.io/coder/coder:latest
    restart: unless-stopped
    ports:
      - "7080:7080"
    environment:
      # Public URL where users access Coder (CHANGE THIS)
      CODER_ACCESS_URL: "${CODER_ACCESS_URL:-http://localhost:7080}"
      # Wildcard for workspace apps (subdomains). CHANGE to match your domain.
      # e.g., *.claudia.yourdomain.com
      CODER_WILDCARD_ACCESS_URL: "${CODER_WILDCARD_ACCESS_URL:-}"
      # PostgreSQL connection
      CODER_PG_CONNECTION_URL: "postgresql://coder:coder@postgres:5432/coder?sslmode=disable"
      # Listen on all interfaces
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
    volumes:
      # Give Coder access to Docker socket so it can create workspace containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    volumes:
      - coder_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coder_pg_data:
